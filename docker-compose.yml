# Run:  docker compose up -d
# Publish behind your existing reverse proxy as dotfiles.example.com,
# which terminates TLS; /install emits PUBLIC_BASE_URL (forwarded headers are only
# honored from peers listed in TRUSTED_PROXY_CIDRS).
services:
  dotfiles:
    image: ghcr.io/rake-pro/dotfiles:latest
    # for local builds instead of the GHCR image, comment image: and uncomment:
    # build: .
    container_name: dotfiles
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - LISTEN_ADDR=:8080
      # Set to the URL your proxy serves this at; it is baked into /install output.
      - PUBLIC_BASE_URL=https://dotfiles.example.com
